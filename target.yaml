revision_claims:
  factor_two: "Q_G/2 <= Q_* <= Q_G for all positive-rank Gaussian pairs; upper half of excess bound from Delon et al."
  factor_two_sharpness: "a=1+eps*u, b=1+eps*v, u!=v nonincreasing zero-sum: D/Q_G >= d/(2(d+2)) - O(eps); sup D/Q_G = 1/2"
  comonotone_refinement: "D <= 4*(M_co - alpha*beta - 2*a.b), M_co = int_0^1 F^{-1}_{|X|^2} F^{-1}_{|Y|^2}"
  plug_in_inconsistency: "empirical GW value -> Q_*, plug-in Gaussian formula -> Q_G; limit gap >= S/(|a||b|)"
  stability: "sqrt(Q_*) satisfies the triangle inequality; Q_*(mu,mu') <= 32*sqrt(2)*W4^2*(m4+m4')^(1/2)"
