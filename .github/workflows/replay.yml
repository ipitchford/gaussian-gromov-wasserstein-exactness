# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  quick:
    name: Quick checks (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Exact checkers, combined-flow, proof-digest, bracket demo and negative controls (-I -O -B) in a copy, outputs compared
        run: python -I -B tools/replay_compare.py . --quick
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
  full:
    name: Full suite (non-blocking, about 10 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Every checker (-I -O -B) in a copy, outputs compared
        run: python -I -B tools/replay_compare.py .
